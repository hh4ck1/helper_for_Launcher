name: Validate stable pack

on:
  push:
    branches: [main]
    paths:
      - "channel/**"
      - "packs/**"
      - "public-key.pem"
      - "tools/Validate-Pack.ps1"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signature, files and hashes
        shell: pwsh
        run: ./tools/Validate-Pack.ps1
