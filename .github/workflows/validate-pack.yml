name: Validate stable pack

on:
  push:
    branches: [main]
    paths:
      - "channel/**"
      - "packs/**"
      - "public-key.pem"
      - "tools/ValidatePack/**"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Verify signature, files and hashes
        run: dotnet run --project tools/ValidatePack/ValidatePack.csproj -c Release -- .
